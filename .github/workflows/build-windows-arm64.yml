# .github/workflows/build-windows-arm64.yml

name: Build udp2raw for Windows ARM64 (Server Mode)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 步骤 2：安装 MSYS2 和必要的编译工具
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANGARM64
        update: true
        install: >-
          git
          make
          cmake
          mingw-w64-clang-aarch64-toolchain

    # 步骤 3：编译 udp2raw
    - name: Build udp2raw for ARM64
      run: |
        # 创建构建目录
        mkdir build && cd build
        
        # 运行 CMake 配置项目
        # 移除了 -G "MinGW Makefiles" 参数，让 CMake 自动选择合适的生成器（如 Unix Makefiles）
        cmake .. -DENABLE_SERVER=ON -DENABLE_CLIENT=OFF
                 
        # 执行编译
        make

    # 步骤 4：上传编译产物
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-windows-arm64-server
        # 在 MSYS2 环境下，生成的可执行文件通常会带 .exe 后缀
        path: build/udp2raw.exe
        if-no-files-found: error # 如果找不到文件则报错

