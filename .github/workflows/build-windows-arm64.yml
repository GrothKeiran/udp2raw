# .github/workflows/build-windows-arm64.yml

name: Build udp2raw for Windows ARM64 (Server Mode)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    
    # 设置默认的 shell 为 msys2，这样后续步骤可以直接使用 msys2 环境
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 步骤 2：安装 MSYS2 和必要的编译工具
    # 在这里我们明确地加入 `cmake` 和 `make`
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANGARM64  # 指定使用 AArch64 (ARM64) 的 Clang 环境
        update: true
        install: >-
          git
          make
          cmake
          mingw-w64-clang-aarch64-toolchain

    # 步骤 3：编译 udp2raw
    # 由于设置了默认 shell，这里不再需要 `shell: msys2 {0}`
    - name: Build udp2raw for ARM64
      run: |
        # 创建构建目录
        mkdir build && cd build
        
        # 运行 CMake 配置项目
        # -G "MinGW Makefiles" 指定使用 MinGW 的 makefile 生成器
        # CMAKE_TOOLCHAIN_FILE 变量现在由 msys2/setup-msys2 自动设置
        cmake .. -G "MinGW Makefiles" \
                 -DENABLE_SERVER=ON \
                 -DENABLE_CLIENT=OFF
                 
        # 执行编译
        make

    # 步骤 4：上传编译产物
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-windows-arm64-server
        # 注意：udp2raw 的 CMakeLists.txt 可能会将输出文件命名为 udp2raw.exe
        # 我们在这里同时匹配 udp2raw.exe 和 udp2raw_arm64.exe 以确保能上传成功
        path: |
          build/udp2raw.exe
          build/udp2raw_arm64.exe
        if-no-files-found: error # 如果找不到文件则报错

