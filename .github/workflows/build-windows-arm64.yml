# .github/workflows/build-windows-x64.yml

name: Build udp2raw for Windows x64 (Server Mode)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 步骤 1：检出代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 步骤 2：设置 MSYS2 环境
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make
          cmake
          mingw-w64-x86_64-toolchain

    # 步骤 3：编译 udp2raw
    - name: Build udp2raw for x64
      shell: msys2 {0}
      run: |
        # 创建构建目录
        mkdir build && cd build
        
        # 运行 CMake 配置项目
        # 核心修改：使用 CMAKE_C_FLAGS 和 CMAKE_CXX_FLAGS 添加了 -D_WIN32 宏定义。
        # 这个宏会告诉预处理器当前是 Windows 环境，从而避免包含 <linux/filter.h>。
        # 同时，根据项目实际情况，我们使用 -DDISABLE_CLIENT=1 来禁用客户端。
        cmake .. -DCMAKE_C_FLAGS="-D_WIN32" \
                 -DCMAKE_CXX_FLAGS="-D_WIN32" \
                 -DDISABLE_CLIENT=1
                 
        # 执行编译
        make

    # 步骤 4：上传编译产物
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-windows-x64-server
        path: build/udp2raw.exe
        if-no-files-found: error

