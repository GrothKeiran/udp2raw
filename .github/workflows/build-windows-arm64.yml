name: Build udp2raw Windows ARM64

on:
  push:
    branches: [ unified, main ]
  pull_request:
    branches: [ unified, main ]
  workflow_dispatch:

jobs:
  build-windows-arm64:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@v1.3
    
    - name: Download Npcap SDK
      shell: powershell
      run: |
        Write-Host "Downloading Npcap SDK..."
        Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "npcap-sdk.zip"
        Expand-Archive -Path "npcap-sdk.zip" -DestinationPath "C:\npcap-sdk" -Force
        
        if (Test-Path "C:\npcap-sdk\Include\pcap.h") {
            Write-Host "Npcap SDK installed successfully"
        } else {
            Write-Host "Npcap SDK installation failed"
            exit 1
        }
    
    - name: List source files
      shell: powershell
      run: |
        Write-Host "=== Source files ==="
        Get-ChildItem -Path . -Filter "*.cpp" | ForEach-Object { Write-Host $_.Name }
        Get-ChildItem -Path "lib" -Filter "*.cpp" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "lib/$($_.Name)" }
    
    - name: Create build directories
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "build"
    
    - name: Manual compilation
      shell: powershell
      run: |
        Write-Host "Setting up compilation environment..."
        
        # 查找 Visual Studio 安装路径
        $vsPath = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022" | Select-Object -First 1
        $vsFullPath = $vsPath.FullName
        Write-Host "VS Path: $vsFullPath"
        
        # 设置编译器路径
        $compilerPath = "$vsFullPath\VC\Tools\MSVC"
        $compilerVersion = Get-ChildItem $compilerPath | Sort-Object Name -Descending | Select-Object -First 1
        $compilerFullPath = "$($compilerVersion.FullName)\bin\Hostx64\arm64"
        Write-Host "Compiler path: $compilerFullPath"
        
        # Windows SDK 路径
        $sdkPath = "C:\Program Files (x86)\Windows Kits\10"
        $sdkVersion = Get-ChildItem "$sdkPath\Include" | Where-Object { $_.Name -like "10.0.*" } | Sort-Object Name -Descending | Select-Object -First 1
        Write-Host "SDK Version: $($sdkVersion.Name)"
        
        # 编译参数
        $includes = @(
            "/I`"C:\npcap-sdk\Include`""
            "/I`"$($compilerVersion.FullName)\include`""
            "/I`"$sdkPath\Include\$($sdkVersion.Name)\um`""
            "/I`"$sdkPath\Include\$($sdkVersion.Name)\shared`""
            "/I`"$sdkPath\Include\$($sdkVersion.Name)\ucrt`""
        )
        
        $defines = @(
            "/DWIN32"
            "/DNDEBUG"
            "/D_CONSOLE"
            "/D_CRT_SECURE_NO_WARNINGS"
        )
        
        $cflags = @(
            "/O2"
            "/MT"
            "/EHsc"
            "/W3"
            "/nologo"
        )
        
        # 获取源文件列表
        $mainSources = @(
            "main.cpp"
            "common.cpp"
            "log.cpp"
            "network.cpp"
            "misc.cpp"
            "fd_manager.cpp"
            "client.cpp"
            "server.cpp"
            "my_ev.cpp"
            "packet.cpp"
            "encrypt.cpp"
            "connection.cpp"
        )
        
        $libSources = @()
        if (Test-Path "lib") {
            $libSources = Get-ChildItem "lib" -Filter "*.cpp" | ForEach-Object { "lib\$($_.Name)" }
        }
        
        $allSources = $mainSources + $libSources
        $objFiles = @()
        
        # 编译每个源文件
        foreach ($source in $allSources) {
            if (Test-Path $source) {
                $basename = [System.IO.Path]::GetFileNameWithoutExtension($source)
                $objFile = "build\$basename.obj"
                $objFiles += $objFile
                
                $compileCmd = "`"$compilerFullPath\cl.exe`" $($includes -join ' ') $($defines -join ' ') $($cflags -join ' ') /c `"$source`" /Fo`"$objFile`""
                Write-Host "Compiling: $source"
                
                try {
                    Invoke-Expression $compileCmd
                    if ($LASTEXITCODE -ne 0) {
                        Write-Host "Compilation failed for $source"
                        exit 1
                    }
                } catch {
                    Write-Host "Error compiling $source`: $($_.Exception.Message)"
                    exit 1
                }
            } else {
                Write-Host "Warning: Source file not found: $source"
            }
        }
        
        # 链接
        Write-Host "Linking executable..."
        $libs = @(
            "/LIBPATH:`"C:\npcap-sdk\Lib\ARM64`""
            "/LIBPATH:`"$($compilerVersion.FullName)\lib\arm64`""
            "/LIBPATH:`"$sdkPath\Lib\$($sdkVersion.Name)\um\arm64`""
            "/LIBPATH:`"$sdkPath\Lib\$($sdkVersion.Name)\ucrt\arm64`""
            "wpcap.lib"
            "ws2_32.lib"
            "iphlpapi.lib"
            "kernel32.lib"
            "user32.lib"
        )
        
        $linkCmd = "`"$compilerFullPath\link.exe`" /NOLOGO /SUBSYSTEM:CONSOLE /OUT:`"udp2raw_arm64.exe`" $($objFiles -join ' ') $($libs -join ' ')"
        
        try {
            Invoke-Expression $linkCmd
            if ($LASTEXITCODE -ne 0) {
                Write-Host "Linking failed"
                exit 1
            }
        } catch {
            Write-Host "Error during linking: $($_.Exception.Message)"
            exit 1
        }
    
    - name: Verify executable
      shell: powershell
      run: |
        if (Test-Path "udp2raw_arm64.exe") {
            $fileInfo = Get-Item "udp2raw_arm64.exe"
            Write-Host "Success! Executable created:"
            Write-Host "File: $($fileInfo.Name)"
            Write-Host "Size: $($fileInfo.Length) bytes"
            Write-Host "Created: $($fileInfo.CreationTime)"
        } else {
            Write-Host "ERROR: Executable not found!"
            Write-Host "Build directory contents:"
            Get-ChildItem "build" -ErrorAction SilentlyContinue
            Write-Host "Current directory contents:"
            Get-ChildItem "." -Filter "*.exe"
            exit 1
        }
    
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-windows-arm64
        path: udp2raw_arm64.exe
        retention-days: 30
    
    - name: Show final message
      shell: powershell
      run: |
        Write-Host "================================================"
        Write-Host "Build completed successfully!"
        Write-Host "You can download the executable from the Artifacts section."
        Write-Host "File name: udp2raw_arm64.exe"
        Write-Host "This version should support server mode (-s) for Windows ARM64."
        Write-Host "================================================"
