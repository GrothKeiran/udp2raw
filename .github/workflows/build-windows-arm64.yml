# .github/workflows/build-windows-arm64.yml

name: Build udp2raw for Windows ARM64 (Server Mode)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 步骤 1：检出代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 步骤 2：安装交叉编译工具链
    - name: Setup MSYS2 cross-compilation environment
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make
          cmake
          mingw-w64-x86_64-clang
          mingw-w64-x86_64-lld
          mingw-w64-x86_64-compiler-rt

    # 步骤 3：编译 udp2raw
    - name: Build udp2raw for ARM64
      shell: msys2 {0}
      run: |
        # 创建构建目录
        mkdir build && cd build
        
        # 运行 CMake 配置交叉编译项目
        # -DCMAKE_LINKER=lld：这是最关键的修改，强制 CMake 使用 lld 链接器。
        # -DDISABLE_PCAP=ON：禁用 pcap 依赖，避免交叉编译时出现库找不到的问题。
        cmake .. -G "Unix Makefiles" \
                 -DCMAKE_SYSTEM_NAME=Windows \
                 -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                 -DCMAKE_C_COMPILER=clang \
                 -DCMAKE_CXX_COMPILER=clang++ \
                 -DCMAKE_LINKER=lld \
                 -DCMAKE_C_FLAGS="--target=aarch64-w64-mingw32" \
                 -DCMAKE_CXX_FLAGS="--target=aarch64-w64-mingw32" \
                 -DENABLE_SERVER=ON \
                 -DENABLE_CLIENT=OFF \
                 -DDISABLE_PCAP=ON
                 
        # 执行编译
        make

    # 步骤 4：上传编译产物
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-windows-arm64-server
        path: build/udp2raw.exe
        if-no-files-found: error

