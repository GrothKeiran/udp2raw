name: Build udp2raw Windows ARM64 (MinGW)

on:
  push:
    branches: [ unified, main ]
  pull_request:
    branches: [ unified, main ]
  workflow_dispatch:

jobs:
  build-with-mingw:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          build-essential \
          wget \
          unzip
    
    - name: Download WinPcap SDK
      run: |
        wget -O npcap-sdk.zip "https://npcap.com/dist/npcap-sdk-1.13.zip"
        unzip npcap-sdk.zip -d npcap-sdk
        
    - name: Prepare source files
      run: |
        # 创建一个简化的 Makefile
        cat > Makefile.cross << 'EOF'
        CC = aarch64-linux-gnu-gcc
        CXX = aarch64-linux-gnu-g++
        CXXFLAGS = -O2 -std=c++11 -DLINUX -DNDEBUG -Wall -Wno-unused-function
        LDFLAGS = -static-libgcc -static-libstdc++
        
        SOURCES = $(wildcard *.cpp) $(wildcard lib/*.cpp)
        OBJECTS = $(SOURCES:.cpp=.o)
        TARGET = udp2raw_linux_arm64
        
        all: $(TARGET)
        
        $(TARGET): $(OBJECTS)
        	$(CXX) $(LDFLAGS) -o $@ $^ -lpcap
        
        %.o: %.cpp
        	$(CXX) $(CXXFLAGS) -c $< -o $@
        
        clean:
        	rm -f $(OBJECTS) $(TARGET)
        
        .PHONY: all clean
        EOF
    
    - name: Build with cross-compiler
      run: |
        make -f Makefile.cross
    
    - name: Verify executable
      run: |
        if [ -f "udp2raw_linux_arm64" ]; then
            echo "Build successful!"
            ls -la udp2raw_linux_arm64
            file udp2raw_linux_arm64
        else
            echo "Build failed!"
            exit 1
        fi
    
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-linux-arm64
        path: udp2raw_linux_arm64
        retention-days: 30
