# .github/workflows/build-windows-arm64.yml

name: Build udp2raw for Windows ARM64 (Server Mode)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 步骤 2：安装正确的交叉编译工具链
    # 我们使用 MINGW64 环境，因为它是在 x86_64 主机上运行的。
    # 然后我们安装一个可以生成 aarch64 (ARM64) 代码的 Clang 工具链。
    - name: Setup MSYS2 cross-compilation environment
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64 # 宿主环境是 x86_64
        update: true
        install: >-
          make
          cmake
          mingw-w64-x86_64-clang # 安装能在 x86_64 上运行的 Clang
          mingw-w64-x86_64-lld   # 安装链接器
          mingw-w64-x86_64-compiler-rt

    # 步骤 3：编译 udp2raw
    - name: Build udp2raw for ARM64
      # 使用 MINGW64 shell
      shell: msys2 {0}
      run: |
        # 创建构建目录
        mkdir build && cd build
        
        # 运行 CMake 配置项目
        # -DCMAKE_SYSTEM_NAME=Windows：告知 CMake 我们正在为 Windows 系统编译
        # -DCMAKE_SYSTEM_PROCESSOR=aarch64：指定目标 CPU 架构
        # -DCMAKE_C_COMPILER=clang：明确指定使用 clang 作为 C 编译器
        # -DCMAKE_CXX_COMPILER=clang++：明确指定使用 clang++ 作为 C++ 编译器
        # --target=aarch64-w64-mingw32：这是传递给 Clang 的关键参数，告诉它生成 ARM64 代码
        cmake .. -DCMAKE_SYSTEM_NAME=Windows \
                 -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                 -DCMAKE_C_COMPILER=clang \
                 -DCMAKE_CXX_COMPILER=clang++ \
                 -DCMAKE_C_FLAGS="--target=aarch64-w64-mingw32" \
                 -DCMAKE_CXX_FLAGS="--target=aarch64-w64-mingw32" \
                 -DENABLE_SERVER=ON \
                 -DENABLE_CLIENT=OFF
                 
        # 执行编译
        make

    # 步骤 4：上传编译产物
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-windows-arm64-server
        path: build/udp2raw.exe
        if-no-files-found: error

