name: Build Windows ARM64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-arm64:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: true
        install: >-
          mingw-w64-clang-aarch64-toolchain
          mingw-w64-clang-aarch64-gcc
          mingw-w64-clang-aarch64-gcc-libs
          mingw-w64-clang-aarch64-make
          mingw-w64-clang-aarch64-cmake
          make
          git

    - name: Build udp2raw for Windows ARM64
      shell: msys2 {0}
      run: |
        # 设置交叉编译环境变量
        export CC=aarch64-w64-mingw32-gcc
        export CXX=aarch64-w64-mingw32-g++
        export AR=aarch64-w64-mingw32-ar
        export STRIP=aarch64-w64-mingw32-strip
        export RANLIB=aarch64-w64-mingw32-ranlib
        
        # 添加编译标志
        export CFLAGS="-static -O2"
        export CXXFLAGS="-static -O2"
        export LDFLAGS="-static -static-libgcc -static-libstdc++"
        
        # 编译
        make cross3 -j$(nproc)
        
        # 重命名输出文件
        if [ -f "udp2raw_cross3" ]; then
          mv udp2raw_cross3 udp2raw_windows_arm64.exe
        elif [ -f "udp2raw" ]; then
          mv udp2raw udp2raw_windows_arm64.exe
        fi
        
        # 验证文件是否生成
        ls -la *.exe || echo "No exe files found"
        
        # 显示文件信息
        if [ -f "udp2raw_windows_arm64.exe" ]; then
          file udp2raw_windows_arm64.exe
          ls -lh udp2raw_windows_arm64.exe
        fi

    - name: Alternative build method (if main build fails)
      shell: msys2 {0}
      if: failure()
      run: |
        echo "Trying alternative build method..."
        
        # 清理之前的构建
        make clean || true
        
        # 尝试直接使用 g++ 编译
        aarch64-w64-mingw32-g++ -static -O2 -std=c++11 \
          -DUDP2RAW_VERSION=\"$(git describe --tags --always)\" \
          -I. \
          *.cpp \
          -o udp2raw_windows_arm64.exe \
          -lws2_32 -lwinmm -static-libgcc -static-libstdc++
        
        # 验证文件
        if [ -f "udp2raw_windows_arm64.exe" ]; then
          echo "Alternative build successful!"
          file udp2raw_windows_arm64.exe
          ls -lh udp2raw_windows_arm64.exe
        else
          echo "Alternative build also failed"
          exit 1
        fi

    - name: Create release info
      shell: msys2 {0}
      run: |
        echo "Build Date: $(date)" > release_info.txt
        echo "Commit: $(git rev-parse HEAD)" >> release_info.txt
        echo "Branch: $(git branch --show-current)" >> release_info.txt
        if [ -f "udp2raw_windows_arm64.exe" ]; then
          echo "File Size: $(stat -c%s udp2raw_windows_arm64.exe) bytes" >> release_info.txt
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-windows-arm64
        path: |
          udp2raw_windows_arm64.exe
          release_info.txt
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          udp2raw_windows_arm64.exe
          release_info.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
