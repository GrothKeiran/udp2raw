name: Build udp2raw ARM64 (Docker Cross-Compile)

on:
  workflow_dispatch:

jobs:
  cross-compile-arm64:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Create cross-compilation environment
      run: |
        cat > Dockerfile << 'EOF'
        FROM --platform=linux/amd64 ubuntu:20.04
        
        # 安装交叉编译工具链
        RUN apt-get update && apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            build-essential \
            make \
            && rm -rf /var/lib/apt/lists/*
        
        WORKDIR /src
        COPY . .
        
        # 创建简化的 Makefile 用于交叉编译
        RUN cat > Makefile.cross << 'MAKEFILE_EOF'
        CC = aarch64-linux-gnu-gcc
        CXX = aarch64-linux-gnu-g++
        
        CXXFLAGS = -O2 -std=c++11 -DLINUX -DNDEBUG -Wall -Wno-unused-function -static
        LDFLAGS = -static
        
        # 获取所有 .cpp 文件
        MAIN_SOURCES = $(wildcard *.cpp)
        LIB_SOURCES = $(wildcard lib/*.cpp)
        ALL_SOURCES = $(MAIN_SOURCES) $(LIB_SOURCES)
        
        OBJECTS = $(ALL_SOURCES:.cpp=.o)
        TARGET = udp2raw_linux_arm64_static
        
        all: $(TARGET)
        
        $(TARGET): $(OBJECTS)
        	$(CXX) $(LDFLAGS) -o $@ $^
        
        %.o: %.cpp
        	$(CXX) $(CXXFLAGS) -c $< -o $@
        
        clean:
        	rm -f $(OBJECTS) $(TARGET)
        
        list-sources:
        	@echo "Main sources: $(MAIN_SOURCES)"
        	@echo "Lib sources: $(LIB_SOURCES)"
        	@echo "All sources: $(ALL_SOURCES)"
        
        .PHONY: all clean list-sources
        MAKEFILE_EOF
        
        # 显示源文件
        make -f Makefile.cross list-sources
        
        # 开始编译
        make -f Makefile.cross
        
        # 检查结果
        if [ -f "udp2raw_linux_arm64_static" ]; then
            echo "Build successful!"
            ls -la udp2raw_linux_arm64_static
            file udp2raw_linux_arm64_static
        else
            echo "Build failed!"
            exit 1
        fi
        EOF
    
    - name: Build with Docker
      run: |
        docker build -t udp2raw-builder .
        
        # 创建容器并复制结果
        docker create --name temp-container udp2raw-builder
        docker cp temp-container:/src/udp2raw_linux_arm64_static ./
        docker rm temp-container
    
    - name: Verify executable
      run: |
        if [ -f "udp2raw_linux_arm64_static" ]; then
            echo "Cross-compilation successful!"
            ls -la udp2raw_linux_arm64_static
            file udp2raw_linux_arm64_static
            
            # 重命名为更清晰的名称
            mv udp2raw_linux_arm64_static udp2raw_arm64_server_support
        else
            echo "Cross-compilation failed!"
            exit 1
        fi
    
    - name: Upload ARM64 executable
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-arm64-linux-static
        path: udp2raw_arm64_server_support
        retention-days: 30
    
    - name: Create usage guide
      run: |
        cat > ARM64_USAGE_GUIDE.md << 'EOF'
        # udp2raw ARM64 Linux Executable
        
        ## What you got
        - A statically linked ARM64 Linux executable
        - **FULL SERVER SUPPORT** (unlike the official Windows multi-platform version)
        - Can run on ARM64 Linux systems, including WSL2 if available
        
        ## How to use on Windows ARM64
        
        ### Option 1: WSL2 (if supported on your ARM64 Windows)
        1. Install WSL2 with Ubuntu
        2. Copy the executable to WSL2
        3. Run: `chmod +x udp2raw_arm64_server_support`
        4. Run: `sudo ./udp2raw_arm64_server_support -s -l 0.0.0.0:40000 -r 127.0.0.1:19132 -k "Zhl20020713!" --raw-mode faketcp`
        
        ### Option 2: Linux VM
        1. Install an ARM64 Linux VM (Ubuntu, Debian, etc.)
        2. Copy the executable to the VM
        3. Run with same commands as above
        
        ### Option 3: Native ARM64 Linux Server
        If you have access to an ARM64 Linux server, this will run natively.
        
        ## Server Mode Usage
        ```bash
        # Make executable
        chmod +x udp2raw_arm64_server_support
        
        # Run server mode (what you need for MC server)
        sudo ./udp2raw_arm64_server_support -s -l 0.0.0.0:40000 -r 127.0.0.1:19132 -k "Zhl20020713!" --raw-mode faketcp
        ```
        
        ## Client Mode Usage
        ```bash
        # Run client mode
        sudo ./udp2raw_arm64_server_support -c -l 0.0.0.0:30000 -r YOUR_SERVER_IP:40000 -k "Zhl20020713!" --raw-mode faketcp
        ```
        
        ## Why this works
        - This is compiled from the original udp2raw source (not the limited multi-platform version)
        - Includes full server mode support
        - Statically linked, so no dependencies needed
        
        EOF
        
        echo "Usage guide created!"
    
    - name: Upload usage guide
      uses: actions/upload-artifact@v4
      with:
        name: arm64-usage-guide
        path: ARM64_USAGE_GUIDE.md
        retention-days: 30
