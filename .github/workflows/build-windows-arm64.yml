# .github/workflows/build-windows-x64.yml

name: Build udp2raw for Windows x64 (Server Mode)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 步骤 1：检出代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 步骤 2：设置 MSYS2 环境
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make
          cmake
          mingw-w64-x86_64-toolchain

    # 步骤 3：在编译前修补源代码
    # 这是解决问题的关键步骤
    - name: Patch source code for Windows build
      shell: bash
      run: |
        # 使用 sed 命令直接在 common.h 文件中注释掉 #include <linux/filter.h> 这一行
        # 这可以从根本上解决 "linux/filter.h: No such file or directory" 的错误
        sed -i 's|#include <linux/filter.h>|//#include <linux/filter.h>|' common.h
        echo "Patched common.h to disable linux-specific header."

    # 步骤 4：编译 udp2raw
    - name: Build udp2raw for x64
      shell: msys2 {0}
      run: |
        # 创建构建目录
        mkdir build && cd build
        
        # 运行 CMake 配置项目
        # 我们不再需要传递复杂的宏定义，因为源代码已经被修复
        # 根据项目的 CMakeLists.txt，通过 -DDISABLE_CLIENT=1 来构建仅服务器模式
        cmake .. -DDISABLE_CLIENT=1
                 
        # 执行编译
        make

    # 步骤 5：上传编译产物
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-windows-x64-server
        path: build/udp2raw.exe
        if-no-files-found: error

