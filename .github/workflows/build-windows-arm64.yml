name: Build Windows ARM64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-arm64:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install ARM64 Windows cross compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-aarch64 g++-mingw-w64-aarch64

    - name: Build udp2raw for Windows ARM64
      run: |
        # 设置交叉编译环境变量
        export CC=aarch64-w64-mingw32-gcc
        export CXX=aarch64-w64-mingw32-g++
        export AR=aarch64-w64-mingw32-ar
        export STRIP=aarch64-w64-mingw32-strip
        
        # 验证编译器
        $CC --version
        $CXX --version
        
        # 生成版本信息
        echo "const char * gitversion=\"$(git describe --tags --always --dirty)\";" > git_version.h
        
        # 编译
        $CXX -static -O2 -std=c++11 \
          -DUDP2RAW_VERSION=\"$(git describe --tags --always)\" \
          -I. \
          main.cpp \
          lib/md5.cpp \
          lib/pbkdf2-sha1.cpp \
          lib/pbkdf2-sha256.cpp \
          encrypt.cpp \
          log.cpp \
          network.cpp \
          common.cpp \
          connection.cpp \
          misc.cpp \
          fd_manager.cpp \
          client.cpp \
          server.cpp \
          lib/aes_faster_c/aes.cpp \
          lib/aes_faster_c/wrapper.cpp \
          my_ev.cpp \
          -o udp2raw_windows_arm64.exe \
          -lws2_32 -lwinmm -static-libgcc -static-libstdc++ \
          -Wl,--gc-sections -s
        
        # 验证文件
        if [ -f "udp2raw_windows_arm64.exe" ]; then
          echo "✅ Build successful!"
          ls -lh udp2raw_windows_arm64.exe
          file udp2raw_windows_arm64.exe
        else
          echo "❌ Build failed"
          exit 1
        fi

    - name: Create release info
      run: |
        echo "Build Date: $(date)" > release_info.txt
        echo "Commit: $(git rev-parse HEAD)" >> release_info.txt
        echo "Branch: $(git branch --show-current)" >> release_info.txt
        echo "Target: Windows ARM64" >> release_info.txt
        if [ -f "udp2raw_windows_arm64.exe" ]; then
          echo "File Size: $(stat -c%s udp2raw_windows_arm64.exe) bytes" >> release_info.txt
          echo "SHA256: $(sha256sum udp2raw_windows_arm64.exe | cut -d' ' -f1)" >> release_info.txt
        fi
        cat release_info.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-windows-arm64
        path: |
          udp2raw_windows_arm64.exe
          release_info.txt
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          udp2raw_windows_arm64.exe
          release_info.txt
        draft: false
        prerelease: false
        body: |
          Windows ARM64 build of udp2raw
          
          **Installation:**
          1. Download `udp2raw_windows_arm64.exe`
          2. Run on Windows ARM64 devices
          
          **Build Info:**
          - Target: Windows ARM64
          - Compiler: GCC MinGW-w64
          - Static linking: Yes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
