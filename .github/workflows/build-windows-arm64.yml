name: Build Windows ARM64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-arm64:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget xz-utils

    - name: Download and setup LLVM-MinGW
      run: |
        # 下载预编译的LLVM-MinGW工具链
        wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20231128/llvm-mingw-20231128-ucrt-ubuntu-20.04-x86_64.tar.xz
        
        # 解压
        tar -xf llvm-mingw-20231128-ucrt-ubuntu-20.04-x86_64.tar.xz
        
        # 移动到固定位置
        sudo mv llvm-mingw-20231128-ucrt-ubuntu-20.04-x86_64 /opt/llvm-mingw
        
        # 添加到PATH
        echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH
        
        # 验证安装
        /opt/llvm-mingw/bin/aarch64-w64-mingw32-gcc --version

    - name: Build udp2raw for Windows ARM64
      run: |
        # 设置编译器路径
        export PATH="/opt/llvm-mingw/bin:$PATH"
        export CC=aarch64-w64-mingw32-gcc
        export CXX=aarch64-w64-mingw32-g++
        
        # 再次验证编译器
        which $CC
        which $CXX
        $CC --version
        
        # 生成版本信息
        echo "const char * gitversion=\"$(git describe --tags --always --dirty)\";" > git_version.h
        
        # 列出所有cpp文件看看项目结构
        find . -name "*.cpp" -type f | head -20
        
        # 编译主程序
        $CXX -static -O2 -std=c++11 \
          -DUDP2RAW_VERSION=\"$(git describe --tags --always)\" \
          -I. \
          main.cpp \
          lib/md5.cpp \
          lib/pbkdf2-sha1.cpp \
          lib/pbkdf2-sha256.cpp \
          encrypt.cpp \
          log.cpp \
          network.cpp \
          common.cpp \
          connection.cpp \
          misc.cpp \
          fd_manager.cpp \
          client.cpp \
          server.cpp \
          lib/aes_faster_c/aes.cpp \
          lib/aes_faster_c/wrapper.cpp \
          my_ev.cpp \
          -o udp2raw_windows_arm64.exe \
          -lws2_32 -lwinmm -static-libgcc -static-libstdc++ \
          -Wl,--gc-sections -s
        
        # 检查结果
        if [ -f "udp2raw_windows_arm64.exe" ]; then
          echo "✅ 编译成功！"
          ls -lh udp2raw_windows_arm64.exe
          file udp2raw_windows_arm64.exe
        else
          echo "❌ 编译失败，尝试备用方案..."
          
          # 备用方案：使用Make
          if [ -f "makefile" ] || [ -f "Makefile" ]; then
            export PATH="/opt/llvm-mingw/bin:$PATH"
            make clean || true
            make cross3 CC=aarch64-w64-mingw32-gcc CXX=aarch64-w64-mingw32-g++ -j$(nproc) || true
            
            # 检查make的输出
            if [ -f "udp2raw_cross3" ]; then
              mv udp2raw_cross3 udp2raw_windows_arm64.exe
            elif [ -f "udp2raw" ]; then
              mv udp2raw udp2raw_windows_arm64.exe
            fi
          fi
          
          # 最终检查
          if [ -f "udp2raw_windows_arm64.exe" ]; then
            echo "✅ 备用方案成功！"
            ls -lh udp2raw_windows_arm64.exe
          else
            echo "❌ 所有方案都失败了"
            exit 1
          fi
        fi

    - name: Create release info
      run: |
        echo "Build Date: $(date)" > release_info.txt
        echo "Commit: $(git rev-parse HEAD)" >> release_info.txt
        echo "Target: Windows ARM64" >> release_info.txt
        if [ -f "udp2raw_windows_arm64.exe" ]; then
          echo "File Size: $(stat -c%s udp2raw_windows_arm64.exe) bytes" >> release_info.txt
          echo "SHA256: $(sha256sum udp2raw_windows_arm64.exe | cut -d' ' -f1)" >> release_info.txt
        fi
        cat release_info.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: udp2raw-windows-arm64
        path: |
          udp2raw_windows_arm64.exe
          release_info.txt
        retention-days: 30
